[project]
name = "pareto"
version = "0.1.0"
description = "A lightweight Pareto-front tracker for model evaluations"
requires-python = ">= 3.11"
dependencies = [
    "click >= 8.1",
    "scipy >= 1.11",
]

[project.optional-dependencies]
dev = ["pytest >= 8"]

[project.scripts]
pareto = "pareto.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/pareto"]
# the report template ships with the package, whatever the VCS ignore rules say
artifacts = ["src/pareto/template.html"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-aarch64"]

[tool.pixi.pypi-dependencies]
pareto = { path = ".", editable = true, extras = ["dev"] }

[tool.pixi.tasks]
pareto = "pareto"
test = "pytest"
demo = "python scripts/demo.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
