<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__PARETO_TITLE__</title>
<style>
:root {
  color-scheme: light;
  --page:           #f9f9f7;
  --surface:        #fcfcfb;
  --ink:            #0b0b0b;
  --ink-2:          #52514e;
  --muted:          #898781;
  --grid:           #e1e0d9;
  --axis:           #c3c2b7;
  --border:         rgba(11,11,11,0.10);
  /* series-1 blue / series-2 orange for the two "still in play" states; dominated
     runs wear the muted chrome ink on purpose - recessive, and never the only cue
     (they are also hollow, smaller, and labelled in the tooltip and table). */
  --front:          #2a78d6;
  --tied:           #eb6834;
  --dominated:      #898781;
  --warning:        #fab219;
  --wash:           rgba(42,120,214,0.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page:      #0d0d0d;
    --surface:   #1a1a19;
    --ink:       #ffffff;
    --ink-2:     #c3c2b7;
    --muted:     #898781;
    --grid:      #2c2c2a;
    --axis:      #383835;
    --border:    rgba(255,255,255,0.10);
    --front:     #3987e5;
    --tied:      #d95926;
    --dominated: #898781;
    --wash:      rgba(57,135,229,0.14);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page:      #0d0d0d;
  --surface:   #1a1a19;
  --ink:       #ffffff;
  --ink-2:     #c3c2b7;
  --muted:     #898781;
  --grid:      #2c2c2a;
  --axis:      #383835;
  --border:    rgba(255,255,255,0.10);
  --front:     #3987e5;
  --tied:      #d95926;
  --dominated: #898781;
  --wash:      rgba(57,135,229,0.14);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1280px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 20px; margin: 0 0 2px; letter-spacing: -0.01em; }
h2 { font-size: 13px; margin: 0 0 12px; color: var(--ink-2); font-weight: 600; }
.sub { color: var(--muted); font-size: 12px; word-break: break-all; }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
}

/* header */
header { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; justify-content: space-between; margin-bottom: 16px; }
.stats { display: flex; flex-wrap: wrap; gap: 20px; }
.stat .v { font-size: 22px; font-weight: 600; line-height: 1.1; }
.stat .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

/* controls */
.controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-bottom: 16px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
select, button {
  font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--border); border-radius: 7px; padding: 6px 10px; cursor: pointer;
}
select:focus-visible, button:focus-visible, tr:focus-visible { outline: 2px solid var(--front); outline-offset: 2px; }
.check { display: flex; align-items: center; gap: 6px; padding: 7px 0; cursor: pointer; }
.spacer { flex: 1; }

/* layout */
main { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(300px, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); } }

/* chart */
#plot { width: 100%; display: block; touch-action: none; }
.legend { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 10px; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 10px; height: 10px; border-radius: 50%; }
.swatch.hollow { background: transparent !important; border: 2px solid var(--dominated); }
.note { font-size: 12px; color: var(--muted); margin-top: 10px; }
#tip {
  position: fixed; z-index: 10; pointer-events: none; opacity: 0;
  background: var(--surface); color: var(--ink); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; font-size: 12px;
  box-shadow: 0 6px 20px rgba(0,0,0,.14); transition: opacity .1s; max-width: 260px;
}
#tip b { font-weight: 600; }
#tip .row { display: flex; justify-content: space-between; gap: 14px; font-variant-numeric: tabular-nums; }

/* detail */
.badge {
  display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px;
  border-radius: 999px; border: 1px solid currentColor; letter-spacing: .02em;
}
.badge.front { color: var(--front); }
.badge.tied { color: var(--tied); }
.badge.dominated, .badge.incomplete { color: var(--muted); }
.badge.dirty { color: var(--warning); }
.detail dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; margin: 0 0 14px; }
.detail dt { color: var(--muted); font-size: 12px; }
.detail dd { margin: 0; font-size: 13px; word-break: break-word; font-variant-numeric: tabular-nums; }
.metric { padding: 8px 0; border-top: 1px solid var(--border); }
.metric-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.metric-head .name { font-weight: 600; }
.metric-head .val { font-variant-numeric: tabular-nums; }
.metric .meta { font-size: 11px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font-size: 11px; padding: 2px 8px; border-radius: 999px;
  background: var(--wash); color: var(--ink-2); font-variant-numeric: tabular-nums;
}
pre {
  margin: 0; padding: 10px; background: var(--page); border: 1px solid var(--border);
  border-radius: 7px; font-size: 12px; overflow: auto; max-height: 240px;
}
code { font-size: 12px; }
.link { color: var(--front); cursor: pointer; text-decoration: underline; background: none; border: 0; padding: 0; font: inherit; }
details { margin-bottom: 12px; }
summary { cursor: pointer; font-size: 12px; color: var(--ink-2); }

/* table */
.tablewrap { overflow-x: auto; margin-top: 16px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; cursor: pointer; user-select: none; }
th[aria-sort="ascending"]::after { content: " \2191"; }
th[aria-sort="descending"]::after { content: " \2193"; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--wash); }
tbody tr[aria-selected="true"] { background: var(--wash); box-shadow: inset 2px 0 0 var(--front); }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="title">Pareto front</h1>
      <div class="sub" id="subtitle"></div>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="controls">
    <div class="field"><label for="xsel">X axis</label><select id="xsel"></select></div>
    <div class="field"><label for="ysel">Y axis</label><select id="ysel"></select></div>
    <div class="field"><label for="gsel">Context group</label><select id="gsel"></select></div>
    <label class="check"><input type="checkbox" id="showdom" checked> show dominated runs</label>
    <div class="spacer"></div>
    <button id="theme" type="button" title="Switch light / dark">Theme</button>
  </div>

  <main>
    <section class="card">
      <h2 id="charttitle">Front</h2>
      <svg id="plot" role="img" aria-label="Scatter plot of runs; points on the Pareto front are highlighted"></svg>
      <div class="legend">
        <span><i class="swatch" style="background:var(--front)"></i> on front</span>
        <span><i class="swatch" style="background:var(--tied)"></i> tied with a front run</span>
        <span><i class="swatch hollow"></i> dominated</span>
      </div>
      <div class="note" id="chartnote"></div>
    </section>
    <aside class="card detail" id="detail"></aside>
  </main>

  <section class="card tablewrap" style="margin-top:16px">
    <h2>All runs</h2>
    <table id="tbl"><thead></thead><tbody></tbody></table>
  </section>
</div>
<div id="tip" role="status" aria-live="polite"></div>

<script>
const DATA = /*__PARETO_DATA__*/null;

const $ = (id) => document.getElementById(id);
const SVG_NS = "http://www.w3.org/2000/svg";
const el = (name, attrs = {}, parent = null) => {
  const n = document.createElementNS(SVG_NS, name);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (parent) parent.appendChild(n);
  return n;
};
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const isFolds = (v) => Array.isArray(v);
const mean = (v) => (isFolds(v) ? v.reduce((a, b) => a + b, 0) / v.length : v);
const sd = (v) => {
  if (!isFolds(v) || v.length < 2) return null;
  const m = mean(v);
  return Math.sqrt(v.reduce((a, b) => a + (b - m) ** 2, 0) / (v.length - 1));
};
const num = (x, digits = 6) => (x === null || x === undefined ? "–" : Number(x.toPrecision(digits)).toLocaleString(undefined, { maximumSignificantDigits: digits }));
const when = (ts) => new Date(ts * 1000).toLocaleString();

const state = { x: null, y: null, group: "__all__", showDominated: true, selected: null, sort: { key: "created_at", dir: -1 } };

/* ---------------------------------------------------------------- setup */
function boot() {
  if (!DATA || !DATA.runs || !DATA.runs.length) {
    document.querySelector(".wrap").innerHTML = '<p class="empty">No runs in this ledger yet.</p>';
    return;
  }
  document.title = DATA.title + " — Pareto front";
  $("title").textContent = DATA.title;
  $("subtitle").textContent = DATA.root + " · generated " + DATA.generated_at;

  const counts = { front: 0, tied: 0, dominated: 0, incomplete: 0 };
  DATA.runs.forEach((r) => { counts[r.status] = (counts[r.status] || 0) + 1; });
  const epsTxt = Object.entries(DATA.eps).filter(([, v]) => v).map(([k, v]) => k + "±" + v).join(", ") || "none";
  $("stats").innerHTML = [
    ["runs", DATA.runs.length], ["on front", counts.front], ["tied", counts.tied],
    ["context groups", DATA.groups.length], ["alpha", DATA.alpha], ["eps", epsTxt],
  ].map(([k, v]) => `<div class="stat"><div class="v">${esc(v)}</div><div class="k">${esc(k)}</div></div>`).join("");

  const names = DATA.axes.map((a) => a.name);
  state.x = names[0];
  state.y = names.length > 1 ? names[1] : names[0];
  for (const sel of [$("xsel"), $("ysel")]) {
    sel.innerHTML = DATA.axes.map((a) => `<option value="${esc(a.name)}">${esc(a.name)}${a.direction ? " (" + a.direction + ")" : " (not in front)"}</option>`).join("");
  }
  $("xsel").value = state.x;
  $("ysel").value = state.y;
  $("gsel").innerHTML = [`<option value="__all__">all (${DATA.groups.length})</option>`]
    .concat(DATA.groups.map((g) => `<option value="${esc(g.key)}">${esc(g.label)}</option>`)).join("");
  if (DATA.groups.length === 1) $("gsel").value = DATA.groups[0].key, state.group = DATA.groups[0].key;

  $("xsel").onchange = (e) => { state.x = e.target.value; draw(); };
  $("ysel").onchange = (e) => { state.y = e.target.value; draw(); };
  $("gsel").onchange = (e) => { state.group = e.target.value; draw(); renderTable(); };
  $("showdom").onchange = (e) => { state.showDominated = e.target.checked; draw(); };
  $("theme").onclick = () => {
    const dark = getComputedStyle(document.body).backgroundColor === "rgb(13, 13, 13)";
    document.documentElement.dataset.theme = dark ? "light" : "dark";
    draw();
  };
  window.addEventListener("resize", draw);

  select((DATA.runs.find((r) => r.status === "front") || DATA.runs[0]).run_id);
  renderTable();
  draw();
}

const visible = () => DATA.runs.filter((r) => state.group === "__all__" || r.group === state.group);
const axisOf = (name) => DATA.axes.find((a) => a.name === name) || { name, direction: null };

/* ---------------------------------------------------------------- chart */
function ticks(lo, hi, count) {
  if (!(hi > lo)) { const p = Math.abs(lo || 1) * 0.1; lo -= p; hi += p; }
  const raw = (hi - lo) / count;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= raw) || 10 * mag;
  const out = [];
  for (let t = Math.ceil(lo / step) * step; t <= hi + step * 1e-9; t += step) out.push(Number(t.toPrecision(12)));
  return out;
}

function draw() {
  const svg = $("plot");
  svg.innerHTML = "";
  const xa = axisOf(state.x), ya = axisOf(state.y);
  const rows = visible().filter((r) => r.scores[xa.name] !== undefined && r.scores[ya.name] !== undefined);
  const shown = rows.filter((r) => state.showDominated || r.status !== "dominated");
  $("charttitle").textContent = `${xa.name} vs ${ya.name}`;
  if (!shown.length) { svg.innerHTML = '<text x="12" y="28" fill="currentColor">No runs have both metrics.</text>'; svg.setAttribute("height", 60); return; }

  const W = svg.clientWidth || 640, H = Math.max(320, Math.min(460, W * 0.62));
  const M = { t: 16, r: 22, b: 48, l: 64 };
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("height", H);
  const vx = (r) => mean(r.scores[xa.name]), vy = (r) => mean(r.scores[ya.name]);
  const pad = (arr) => { const lo = Math.min(...arr), hi = Math.max(...arr), s = (hi - lo) || Math.abs(hi) || 1; return [lo - s * 0.08, hi + s * 0.08]; };
  const [x0, x1] = pad(shown.map(vx)), [y0, y1] = pad(shown.map(vy));
  const X = (v) => M.l + ((v - x0) / (x1 - x0)) * (W - M.l - M.r);
  const Y = (v) => H - M.b - ((v - y0) / (y1 - y0)) * (H - M.t - M.b);

  const g = el("g", {}, svg);
  for (const t of ticks(y0, y1, 5)) {
    el("line", { x1: M.l, x2: W - M.r, y1: Y(t), y2: Y(t), stroke: "var(--grid)", "stroke-width": 1 }, g);
    el("text", { x: M.l - 10, y: Y(t) + 4, "text-anchor": "end", fill: "var(--muted)", "font-size": 11, "font-variant-numeric": "tabular-nums" }, g).textContent = num(t, 4);
  }
  for (const t of ticks(x0, x1, 6)) {
    el("line", { x1: X(t), x2: X(t), y1: M.t, y2: H - M.b, stroke: "var(--grid)", "stroke-width": 1 }, g);
    el("text", { x: X(t), y: H - M.b + 18, "text-anchor": "middle", fill: "var(--muted)", "font-size": 11, "font-variant-numeric": "tabular-nums" }, g).textContent = num(t, 4);
  }
  el("line", { x1: M.l, x2: W - M.r, y1: H - M.b, y2: H - M.b, stroke: "var(--axis)", "stroke-width": 1 }, g);
  el("line", { x1: M.l, x2: M.l, y1: M.t, y2: H - M.b, stroke: "var(--axis)", "stroke-width": 1 }, g);
  const arrow = (a) => (a.direction === "max" ? " ↑ higher is better" : a.direction === "min" ? " ↓ lower is better" : "");
  el("text", { x: (M.l + W - M.r) / 2, y: H - 10, "text-anchor": "middle", fill: "var(--ink-2)", "font-size": 12 }, g).textContent = xa.name + arrow(xa);
  const yl = el("text", { x: 14, y: (M.t + H - M.b) / 2, "text-anchor": "middle", fill: "var(--ink-2)", "font-size": 12, transform: `rotate(-90 14 ${(M.t + H - M.b) / 2})` }, g);
  yl.textContent = ya.name + arrow(ya);

  /* staircase envelope: only meaningful inside one context group, with directions known */
  const oneGroup = state.group !== "__all__" || DATA.groups.length === 1;
  const fronts = rows.filter((r) => r.status === "front");
  const gx = (r) => (xa.direction === "max" ? vx(r) : -vx(r));
  const gy = (r) => (ya.direction === "max" ? vy(r) : -vy(r));
  /* A run can be on the front thanks to a metric that is not on screen, and so sit
     inside the 2-D envelope. Trace the envelope over the projected winners only. */
  const hull = fronts.filter((r) => !fronts.some((s) =>
    s !== r && gx(s) >= gx(r) && gy(s) >= gy(r) && (gx(s) > gx(r) || gy(s) > gy(r))));
  if (oneGroup && xa.direction && ya.direction && hull.length) {
    const pts = [...hull].sort((a, b) => gx(b) - gx(a));
    const d = [];
    const edgeY = ya.direction === "max" ? y0 : y1;
    const edgeX = xa.direction === "max" ? x0 : x1;
    d.push(`M ${X(vx(pts[0]))} ${Y(edgeY)}`, `L ${X(vx(pts[0]))} ${Y(vy(pts[0]))}`);
    for (let i = 1; i < pts.length; i++) {
      d.push(`L ${X(vx(pts[i]))} ${Y(vy(pts[i - 1]))}`, `L ${X(vx(pts[i]))} ${Y(vy(pts[i]))}`);
    }
    d.push(`L ${X(edgeX)} ${Y(vy(pts[pts.length - 1]))}`);
    el("path", { d: d.join(" "), fill: "none", stroke: "var(--front)", "stroke-width": 2, "stroke-linejoin": "round", opacity: 0.55 }, g);
  }

  const order = { dominated: 0, tied: 1, front: 2 };
  for (const r of [...shown].sort((a, b) => (order[a.status] || 0) - (order[b.status] || 0))) {
    const cx = X(vx(r)), cy = Y(vy(r)), on = r.run_id === state.selected;
    const color = r.status === "front" ? "var(--front)" : r.status === "tied" ? "var(--tied)" : "var(--dominated)";
    const rad = r.status === "dominated" ? 4 : 5.5;
    const mark = el("circle", {
      cx, cy, r: rad, fill: r.status === "dominated" ? "none" : color,
      stroke: r.status === "dominated" ? color : "var(--surface)", "stroke-width": 2,
    }, g);
    if (on) el("circle", { cx, cy, r: rad + 4.5, fill: "none", stroke: color, "stroke-width": 2 }, g);
    const hit = el("circle", { cx, cy, r: 13, fill: "transparent", style: "cursor:pointer" }, g);
    hit.addEventListener("mousemove", (e) => tip(e, r, xa, ya, !oneGroup));
    hit.addEventListener("mouseleave", () => ($("tip").style.opacity = 0));
    hit.addEventListener("click", () => { select(r.run_id); draw(); });
    mark.style.pointerEvents = "none";
  }

  const notes = [];
  if (hull.length < fronts.length) notes.push(
    `${fronts.length - hull.length} front run(s) sit inside this envelope: they earn their place on a metric that is not on screen.`);
  if (!oneGroup) notes.push("Several context groups are shown together; runs in different groups are never compared, so the envelope is hidden. Pick one group above.");
  if (DATA.ignore.length) notes.push("Ignoring context key(s): " + DATA.ignore.join(", ") + ".");
  if (!xa.direction || !ya.direction) notes.push("An axis metric has no direction (it is not part of the front definition), so no envelope is drawn.");
  $("chartnote").textContent = notes.join(" ");
}

function tip(e, r, xa, ya, withGroup) {
  const t = $("tip");
  const group = withGroup ? " \u00b7 " + esc((DATA.groups.find((g) => g.key === r.group) || {}).label || "") : "";
  t.innerHTML = `<b>${esc(r.run_id)}</b><div style="color:var(--muted);margin-bottom:4px">${esc(r.status)}${r.note ? " · " + esc(r.note) : ""}${group}</div>`
    + [xa, ya].map((a) => `<div class="row"><span>${esc(a.name)}</span><span>${esc(num(mean(r.scores[a.name]), 5))}</span></div>`).join("");
  t.style.opacity = 1;
  const b = t.getBoundingClientRect();
  t.style.left = Math.min(e.clientX + 14, window.innerWidth - b.width - 8) + "px";
  t.style.top = Math.max(8, e.clientY - b.height - 12) + "px";
}

/* --------------------------------------------------------------- detail */
function foldStrip(vals) {
  const lo = Math.min(...vals), hi = Math.max(...vals), m = mean(vals), w = 100, h = 22;
  const pos = (v) => (hi === lo ? w / 2 : 4 + ((v - lo) / (hi - lo)) * (w - 8));
  const dots = vals.map((v) => `<circle cx="${pos(v)}" cy="${h / 2}" r="2.5" fill="var(--front)" opacity="0.45"/>`).join("");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" aria-hidden="true">`
    + `<line x1="4" x2="${w - 4}" y1="${h / 2}" y2="${h / 2}" stroke="var(--grid)" stroke-width="1"/>${dots}`
    + `<line x1="${pos(m)}" x2="${pos(m)}" y1="3" y2="${h - 3}" stroke="var(--front)" stroke-width="2"/></svg>`;
}

function select(id) {
  state.selected = id;
  const r = DATA.runs.find((x) => x.run_id === id);
  const d = $("detail");
  if (!r) { d.innerHTML = '<p class="empty">Pick a run.</p>'; return; }
  const dirs = DATA.metrics;
  const metrics = Object.keys(r.scores).map((m) => {
    const v = r.scores[m], s = sd(v), dir = dirs[m];
    const head = `<div class="metric-head"><span class="name">${esc(m)}${dir ? ` <span class="meta">${dir === "max" ? "↑" : "↓"}</span>` : ""}</span>`
      + `<span class="val">${esc(num(mean(v), 6))}${s !== null ? " <span class=\"meta\">± " + esc(num(s, 3)) + "</span>" : ""}</span></div>`;
    const body = isFolds(v)
      ? `<div class="meta">${v.length} folds · min ${esc(num(Math.min(...v), 4))} · max ${esc(num(Math.max(...v), 4))}</div>${foldStrip(v)}`
      : `<div class="meta">single value</div>`;
    return `<div class="metric">${head}${body}</div>`;
  }).join("");

  const links = (ids) => ids.map((i) => `<button class="link" data-goto="${esc(i)}">${esc(i)}</button>`).join(", ");
  const ctx = Object.entries(r.context);
  d.innerHTML = `
    <h2>Run detail</h2>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px">
      <span class="badge ${esc(r.status)}">${esc(r.status)}</span>
      ${r.dirty ? '<span class="badge dirty">⚠ dirty worktree</span>' : ""}
      <code>${esc(r.run_id)}</code>
    </div>
    ${r.note ? `<p style="margin:0 0 10px">${esc(r.note)}</p>` : ""}
    <dl>
      <dt>created</dt><dd>${esc(when(r.created_at))}</dd>
      <dt>n train / test</dt><dd>${esc(r.n_train ?? "–")} / ${esc(r.n_test ?? "–")}</dd>
      <dt>commit</dt><dd><code>${esc(r.commit ? r.commit.slice(0, 12) : "–")}</code></dd>
      <dt>python</dt><dd>${esc((r.env || {}).python || "–")}</dd>
      ${(r.env || {}).lockfile ? `<dt>lockfile</dt><dd>${esc(r.env.lockfile)} <span class="meta">${esc(r.env.lockfile_sha256 || "")}</span></dd>` : ""}
      <dt>artifact</dt><dd>${r.artifact ? `<code>${esc(r.artifact)}</code>` : "–"}</dd>
    </dl>
    ${ctx.length ? `<h2>Context</h2><div class="chips" style="margin-bottom:14px">${ctx.map(([k, v]) => `<span class="chip">${esc(k)}=${esc(v)}</span>`).join("")}</div>` : ""}
    <h2>Metrics</h2>${metrics}
    ${r.dominated_by.length ? `<p class="note">Dominated by ${links(r.dominated_by)}</p>` : ""}
    ${r.tied_with.length ? `<p class="note">Indistinguishable from ${links(r.tied_with)}</p>` : ""}
    ${Object.keys(r.config || {}).length ? `<details style="margin-top:14px"><summary>config (${Object.keys(r.config).length} keys)</summary><pre>${esc(JSON.stringify(r.config, null, 2))}</pre></details>` : ""}
    ${r.commit ? `<details><summary>restore this run's code</summary><pre>git worktree add ../restore ${esc(r.commit)}</pre></details>` : ""}
  `;
  d.querySelectorAll("[data-goto]").forEach((b) => (b.onclick = () => { select(b.dataset.goto); draw(); markTable(); }));
  markTable();
}

/* ---------------------------------------------------------------- table */
function columns() {
  return [{ key: "run_id", label: "run", get: (r) => r.run_id },
    { key: "status", label: "status", get: (r) => r.status },
    ...DATA.axes.map((a) => ({ key: "m:" + a.name, label: a.name, num: true, get: (r) => (r.scores[a.name] === undefined ? null : mean(r.scores[a.name])) })),
    { key: "created_at", label: "created", get: (r) => r.created_at, fmt: when },
    { key: "note", label: "note", get: (r) => r.note || "" }];
}

function renderTable() {
  const cols = columns();
  const head = $("tbl").tHead, body = $("tbl").tBodies[0];
  head.innerHTML = "<tr>" + cols.map((c) => `<th data-key="${esc(c.key)}" class="${c.num ? "num" : ""}">${esc(c.label)}</th>`).join("") + "</tr>";
  head.querySelectorAll("th").forEach((th) => (th.onclick = () => {
    const k = th.dataset.key;
    state.sort = { key: k, dir: state.sort.key === k ? -state.sort.dir : 1 };
    renderTable();
  }));
  const col = cols.find((c) => c.key === state.sort.key) || cols[0];
  const rows = visible().slice().sort((a, b) => {
    const x = col.get(a), y = col.get(b);
    if (x === null) return 1;
    if (y === null) return -1;
    return (x > y ? 1 : x < y ? -1 : 0) * state.sort.dir;
  });
  head.querySelectorAll("th").forEach((th) => th.setAttribute("aria-sort",
    th.dataset.key === state.sort.key ? (state.sort.dir === 1 ? "ascending" : "descending") : "none"));
  body.innerHTML = rows.map((r) => "<tr tabindex=\"0\" data-id=\"" + esc(r.run_id) + "\">" + cols.map((c) => {
    const v = c.get(r);
    const txt = v === null || v === undefined ? "–" : c.fmt ? c.fmt(v) : c.num ? num(v, 5) : v;
    const cell = c.key === "status" ? `<span class="badge ${esc(r.status)}">${esc(r.status)}</span>` : esc(txt);
    return `<td class="${c.num ? "num" : ""}">${cell}</td>`;
  }).join("") + "</tr>").join("");
  body.querySelectorAll("tr").forEach((tr) => {
    tr.onclick = () => { select(tr.dataset.id); draw(); };
    tr.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(tr.dataset.id); draw(); } };
  });
  markTable();
}

function markTable() {
  document.querySelectorAll("#tbl tbody tr").forEach((tr) =>
    tr.setAttribute("aria-selected", tr.dataset.id === state.selected));
}

boot();
</script>
</body>
</html>
